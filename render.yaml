# HeatSentinel — Render Blueprint (déploiement gratuit, 1 clic)
services:
  - type: web
    name: heatsentinel
    runtime: python
    plan: free
    region: oregon
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    healthCheckPath: /health
    envVars:
      - key: HS_CITY
        value: phoenix
      - key: PYTHON_VERSION
        value: "3.11.9"
