# HeatSentinel — Render Blueprint (déploiement gratuit, 1 clic)
# Sur render.com : "New +" → "Blueprint" → choisir ce repo → "Apply".
# Service web gratuit (512 Mo), réveil ~30–60 s après 15 min d'inactivité.
services:
  - type: web
    name: heatsentinel
    runtime: python
    plan: free
    region: oregon
    autoDeploy: true
    startCommand: python run_server.py
    healthCheckPath: /health
    envVars:
      - key: HS_CITY
        value: phoenix
